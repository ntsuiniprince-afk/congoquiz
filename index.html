<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congoquiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

        <div id="intro">
        
            <div class="intro-light"></div>
        
            <img src="images/logo1.png" alt="Logo CongoQuiz" id="introLogo">
        
        </div>
        
    <nav class="navbar">

        <div class="logo">
            🇨🇬 <strong>CongoQuiz</strong>
        </div>
    
        <div class="menu">
            <a href="index.html">Accueil</a>
            <a href="apropos.html">À propos</a>
        </div>
    
    </nav>
    <div class="accueil">
        <div id="menuPrincipal" class="menu-page">


        <div class="hero">

    
            <p>
                Testez vos connaissances sur la République du Congo
            </p>
        
        </div>
        
    
    
        <p class="sous-titre">
            Découvrez la République du Congo autrement.
            </p>
            
            <button id="btnJouer" onclick="ouvrirMenuJeu()">
            ▶ JOUER
            </button>
            
            <button disabled>
            🌍 Mode en ligne
            <br>
            <small>Bientôt disponible</small>
            </button>
        </div>
        <div id="menuJeu" class="menu-page" style="display:none;">

            <h2>Choisissez un mode</h2>
        
            <button onclick="ouvrirQuizGeneral()">
                🎲 Quiz général
            </button>
        
            <button onclick="ouvrirCategories()">
                📚 Quiz par catégorie
            </button>
        
            <button onclick="fermerMenuJeu()">
                ⬅ Retour
            </button>
        
        </div>
        <div id="menuQuestions" class="menu-page" style="display:none;">

            <h2>Quiz général</h2>
        
            <button onclick="demarrerQuiz(5)">
                🎯 5 Questions
            </button>
        
            <button onclick="demarrerQuiz(10)">
                📘 10 Questions
            </button>
        
            <button onclick="demarrerQuiz(20)">
                🏆 20 Questions
            </button>
        
            <button onclick="retourMenuJeu()">
                ⬅ Retour
            </button>
        
        </div>
        <div id="menuCategories" class="menu-page" style="display:none;">

            <h2>Choisissez une catégorie</h2>
        
            <button onclick="ouvrirQuestionsCategorie('histoire')">
                📜 Histoire
            </button>
        
            <button onclick="ouvrirQuestionsCategorie('culture')">
                🎭 Culture
            </button>
        
            <button onclick="ouvrirQuestionsCategorie('institutions')">
                🏛 Institutions
            </button>
        
            <button onclick="ouvrirQuestionsCategorie('geographie')">
                🌍 Géographie
            </button>
        
            <button onclick="ouvrirQuestionsCategorie('sport')">
                ⚽ Sport
            </button>
        
            <button onclick="ouvrirQuestionsCategorie('musique')">
                🎵 Musique
            </button>
        
            <button onclick="ouvrirQuestionsCategorie('personnalites')">
                👤 Grandes personnalités
            </button>
        
            <button onclick="retourMenuPrincipalJeu()">
                ⬅ Retour
            </button>
        
        </div>
        <div id="menuCategorieQuestions" class="menu-page" style="display:none;">

            <h2 id="titreCategorie">Catégorie</h2>
        
            <button onclick="demarrerCategorie(10)">
                📘 10 Questions
            </button>
        
            <button onclick="demarrerCategorie(20)">
                🏆 20 Questions
            </button>
        
            <button onclick="retourCategories()">
                ⬅ Retour
            </button>
        
        </div>
            <div class="bottom-nav">

                <button class="nav-btn" onclick="alert('🏆 Classement bientôt disponible')">
                    🏆
                    <span>Classement</span>
                </button>
            
                <button class="nav-btn" onclick="alert('📊 Statistiques bientôt disponibles')">
                    📊
                    <span>Stats</span>
                </button>
            
                <button class="nav-btn" onclick="alert('👤 Profil bientôt disponible')">
                    👤
                    <span>Profil</span>
                </button>
            
                <button class="nav-btn" onclick="alert('⚙️ Réglages bientôt disponibles')">
                    ⚙️
                    <span>Réglages</span>
                </button>
            
            </div>
    </div>
    <footer class="footer">

        CongoQuiz • Version 1.0
    
        <br>
    
        © 2026 Royal LIM
    
    </footer>    
    
<script src="script.js"></script>   
</body>
</html>
