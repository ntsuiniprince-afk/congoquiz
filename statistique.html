<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🇨🇬 <strong>CongoQuiz</strong></div>
    
        <div class="menu">
            <a href="index.html?accueil=1">Accueil</a>
        </div>
    </nav>
    
    <h1>📊 Statistiques</h1>

    <div class="stat-card">
    
        <div class="stat-icon">🎮</div>
    
        <div class="stat-valeur" id="partiesJouees">0</div>
    
        <div class="stat-titre">Parties jouées</div>
    
    </div>
    
    <div class="stat-card">
    
        <div class="stat-icon">🏆</div>
    
        <div class="stat-valeur" id="partiesGagnees">0</div>
    
        <div class="stat-titre">Parties gagnées</div>
    
    </div>
    
    <div class="stat-card">
    
        <div class="stat-icon">📈</div>
    
        <div class="stat-valeur" id="tauxReussite">0%</div>
    
        <div class="stat-titre">Taux de réussite</div>
    
    </div>
    
    <button class="rejouer"
    onclick="window.location.href='index.html?accueil=1'">
    🏠 Retour à l'accueil
    </button>
    <script src="script.js"></script>
<script>
     const joueur = chargerJoueur();

document.getElementById("pointsTotal").textContent = joueur.points;

let niveau = "🌱 Débutant";
let objectif = 100;

if(joueur.points >= 100){
    niveau = "📚 Connaisseur";
    objectif = 300;
}

if(joueur.points >= 300){
    niveau = "🏆 Expert";
    objectif = 700;
}

if(joueur.points >= 700){
    niveau = "👑 Maître";
    objectif = 1500;
}

if(joueur.points >= 1500){
    niveau = "💎 Légende";
    objectif = joueur.points;
}

document.getElementById("niveau").textContent = niveau;

let progression = Math.min((joueur.points / objectif) * 100,100);

document.getElementById("progressionNiveau").style.width =
progression + "%";

document.getElementById("texteProgression").textContent =
joueur.points + " / " + objectif + " points";
</script>
<script src="script.js"></script>

<script>

const joueur = chargerJoueur();

document.getElementById("partiesJouees").textContent =
joueur.partiesJouees;

document.getElementById("partiesGagnees").textContent =
joueur.partiesGagnees;

let taux = 0;

if(joueur.partiesJouees > 0){

    taux = Math.round(
        (joueur.partiesGagnees / joueur.partiesJouees) * 100
    );

}

document.getElementById("tauxReussite").textContent =
taux + "%";

</script>
</body>
</html>
