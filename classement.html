<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CongoQuiz - Classement</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🇨🇬 <strong>CongoQuiz</strong>
        </div>

        <div class="menu">

            <a href="index.html?accueil=1">
                Accueil
            </a>

        </div>

    </nav>


    <div class="accueil">

        <h1>🏆 Classement</h1>


        <!-- SCORE DU JOUEUR -->

        <div class="classement-card">

            <div class="trophee">
                🏆
            </div>

            <h2>Mon score</h2>

            <div
                id="pointsTotal"
                class="grandScore">
                0
            </div>

            <div class="libellePoints">
                POINTS
            </div>

            <div
                id="niveau"
                class="niveauClassement">
                🌱 Débutant
            </div>

            <div class="barreNiveau">

                <div
                    id="progressionNiveau">
                </div>

            </div>

            <p id="texteProgression">
                0 / 1000 points
            </p>

        </div>


        <!-- CLASSEMENT GLOBAL -->

        <div class="classement-card">

            <h2>🌍 Classement général</h2>

            <p id="messageClassement">
                Chargement du classement...
            </p>

            <div id="listeClassement"></div>
            <div id="paginationClassement"></div>

        </div>


        <button
            class="rejouer"
            onclick="window.location.href='index.html?accueil=1'">

         🏠 Retour à l'accueil

        </button>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- TON SCRIPT PRINCIPAL -->

    <script src="script.js"></script>


    <!-- CLASSEMENT SUPABASE -->
     <script>

const JOUEURS_PAR_PAGE = 50;

let joueursClassement = [];
let pageClassement = 1;


async function chargerClassementSupabase(){

    const message =
        document.getElementById( "messageClassement");

    if(!message){
        return;
    }

    message.textContent =
        "Chargement du classement...";

    const { data, error } =
        await supabaseClient
            .from("joueur")
            .select(
                "id,pseudo,points,parties_jouees,parties_gagnees"
            )
            .order("points", {
                ascending: false
            });

    if(error){

        console.error(
            "❌ Erreur chargement classement :",
            error
        );

        message.textContent =
            "❌ Impossible de charger le classement.";

        return;
    }

    if(!data || data.length === 0){

        joueursClassement = [];
        pageClassement = 1;

        message.textContent = "";

        document.getElementById(
            "listeClassement"
        ).innerHTML =
            "<p>Aucun joueur dans le classement.</p>";

        document.getElementById(
            "paginationClassement"
        ).innerHTML = "";

        return;
    }

    joueursClassement = data;

    const nombrePages =
        Math.ceil(
            joueursClassement.length /
            JOUEURS_PAR_PAGE
        );

    if(pageClassement > nombrePages){
        pageClassement = nombrePages;
    }

    message.textContent = "";

    afficherPageClassement(pageClassement);

}


function afficherPageClassement(page){

    const liste =
        document.getElementById(
            "listeClassement"
        );

    if(!liste){
        return;
    }

    const joueurLocal =
        chargerJoueur();

    const debut =
        (page - 1) *
        JOUEURS_PAR_PAGE;

    const fin =
        debut +
        JOUEURS_PAR_PAGE;

    const joueursPage =
        joueursClassement.slice(
            debut,
            fin
        );

    liste.innerHTML = "";

    joueursPage.forEach(
        function(joueur, index){

            const rang =
                debut + index + 1;

            const estMoi =
                joueur.id === joueurLocal.id;

            let medaille = "";

            if(rang === 1){
                medaille = "🥇";
            }
            else if(rang === 2){
                medaille = "🥈";
            }
            else if(rang === 3){
                medaille = "🥉";
            }
            else{
                medaille = rang + "e";
            }

            const carte =
                document.createElement("div");

            carte.style.padding = "15px";
            carte.style.marginBottom = "10px";
            carte.style.borderRadius = "12px";
            carte.style.background =
                estMoi
                    ? "#fff3cd"
                    : "#f5f5f5";
            carte.style.fontWeight =
                estMoi
                    ? "bold"
                    : "normal";

            carte.innerHTML = `
                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                ">
                    <span>
                        ${medaille}
                        ${joueur.pseudo || "Joueur"}
                        ${estMoi ? " 👤" : ""}
                    </span>

                    <strong>
                        ${joueur.points || 0} pts
                    </strong>
                </div>

                <div style="
                    margin-top:7px;
                    font-size:13px;
                    opacity:0.75;
                ">
                    🎮 ${joueur.parties_jouees || 0} parties
                    &nbsp; • &nbsp;
                    🏆 ${joueur.parties_gagnees || 0} victoires
                </div>
            `;

         liste.appendChild(carte);

        }
    );

    afficherPaginationClassement();

}


function afficherPaginationClassement(){

    const pagination =
        document.getElementById(
            "paginationClassement"
        );

    if(!pagination){
        return;
    }

    const nombrePages =
        Math.ceil(
            joueursClassement.length /
            JOUEURS_PAR_PAGE
        );

    pagination.innerHTML = "";

    if(nombrePages <= 1){
        return;
    }

    const conteneur =
        document.createElement("div");

    /* Bouton précédent */
    const boutonPrecedent =
        document.createElement("button");

    boutonPrecedent.textContent = "‹";

    boutonPrecedent.title = "Page précédente";

    boutonPrecedent.disabled =
        pageClassement === 1;

    boutonPrecedent.onclick =
        function(){

            if(pageClassement > 1){

                pageClassement--;

                afficherPageClassement(
                    pageClassement
                );

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        };

    conteneur.appendChild(
        boutonPrecedent
    );


    /* Numéros des pages */
    for(
        let page = 1;
        page <= nombrePages;
        page++
    ){

        const bouton =
            document.createElement("button");

        bouton.textContent = page;

        if(page === pageClassement){

            bouton.disabled = true;

            bouton.classList.add(
                "pageActiveClassement"
            );
        }

        bouton.onclick =
            function(){

                pageClassement = page;

                afficherPageClassement(
                    pageClassement
                );

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            };

        conteneur.appendChild(
            bouton
        );
    }


    /* Bouton suivant */
    const boutonSuivant =
        document.createElement("button");

    boutonSuivant.textContent = "»";

    boutonSuivant.title = "Page suivante";

    boutonSuivant.disabled =
        pageClassement === nombrePages;

    boutonSuivant.onclick =
        function(){

            if(pageClassement < nombrePages){

                pageClassement++;

                afficherPageClassement(
                    pageClassement
                );

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        };

    conteneur.appendChild(
        boutonSuivant
    );


    pagination.appendChild(
        conteneur
    );
}


function afficherScorePersonnel(){

    const joueur =
        chargerJoueur();

    document.getElementById(
        "pointsTotal"
    ).textContent =
        joueur.points;

    let niveau =
        "🌱 Débutant";

    let objectif =
        1000;

    if(joueur.points >= 1000){

        niveau =
            "📚 Connaisseur";

        objectif =
            10000;
    }

    if(joueur.points >= 10000){

        niveau =
            "🏆 Expert";

        objectif =
            100000;
    }

    if(joueur.points >= 100000){

        niveau =
            "👑 Maître";

        objectif =
            1000000;
    }

    if(joueur.points >= 1000000){

        niveau =
            "💎 Légende";

        objectif =
            joueur.points;
    }

    document.getElementById(
        "niveau"
    ).textContent =
        niveau;

    const progression =
        Math.min(
            (joueur.points / objectif) * 100,
            100
        );

    document.getElementById(
        "progressionNiveau"
    ).style.width =
        progression + "%";

    document.getElementById(
        "texteProgression"
    ).textContent =
        joueur.points +
        " / " +
        objectif +
        " points";
}


window.addEventListener(
    "load",
    function(){

        afficherScorePersonnel();

        chargerClassementSupabase();

    }
);

</script>
    

    
        
      
</body>

</html>
