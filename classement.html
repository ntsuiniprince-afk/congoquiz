<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🇨🇬 <strong>CongoQuiz</strong></div>
    
        <div class="menu">
            <a href="index.html?accueil=1">Accueil</a>
        </div>
    </nav>
    
    <div class="accueil">
        <h1>🏆 Classement</h1>

        <div class="classement-card">

            <div class="trophee">🏆</div>
        
            <h2>Total des points</h2>
        
            <div id="pointsTotal" class="grandScore">0</div>
        
            <div class="libellePoints">POINTS</div>
        
            <div id="niveau" class="niveauClassement">
                🌱 Débutant
            </div>
        
            <div class="barreNiveau">
                <div id="progressionNiveau"></div>
            </div>
        
            <p id="texteProgression">
                0 / 100 points
            </p>
        
            <p class="descriptionClassement">
                Continue de jouer pour monter dans le classement.
            </p>
        
        </div>
        <button class="rejouer"
    onclick="window.location.href='index.html?accueil=1'">
     🏠 Retour à l'accueil
        </button>
    </div>
    <script src="script.js"></script>
<script>
     const joueur = chargerJoueur();

document.getElementById("pointsTotal").textContent = joueur.points;

let niveau = "🌱 Débutant";
let objectif = 1000;

if(joueur.points >= 1000){
    niveau = "📚 Connaisseur";
    objectif = 10000;
}

if(joueur.points >= 10000){
    niveau = "🏆 Expert";
    objectif = 100000;
}

if(joueur.points >= 100000){
    niveau = "👑 Maître";
    objectif = 1000000;
}

if(joueur.points >= 1000000){
    niveau = "💎 Légende";
    objectif = joueur.points;
}

document.getElementById("niveau").textContent = niveau;

let progression = Math.min((joueur.points / objectif) * 100,100);

document.getElementById("progressionNiveau").style.width =
progression + "%";

document.getElementById("texteProgression").textContent =
joueur.points + " / " + objectif + " points";
</script>
</body>
</html>
